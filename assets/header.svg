<svg width="100%" height="190" viewBox="0 0 920 190" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F14" />
      <stop offset="50%" stop-color="#141A22" />
      <stop offset="100%" stop-color="#080C10" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C59E3F" />
      <stop offset="40%" stop-color="#F3E5BE" />
      <stop offset="70%" stop-color="#D8B756" />
      <stop offset="100%" stop-color="#9E7822" />
    </linearGradient>
    <linearGradient id="cyberBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58A6FF" />
      <stop offset="100%" stop-color="#388BFD" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D8B756" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#30363D" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#D8B756" stop-opacity="0.4" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Card -->
  <rect x="2" y="2" width="916" height="186" rx="18" fill="url(#cardBg)" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Geometric Wave Accents -->
  <path d="M2 135 C 180 95, 340 165, 520 125 C 700 85, 800 145, 918 130 L 918 186 L 2 186 Z" fill="url(#goldGrad)" opacity="0.08" />
  <path d="M2 148 C 220 115, 420 175, 620 135 C 780 105, 860 155, 918 145 L 918 186 L 2 186 Z" fill="url(#cyberBlue)" opacity="0.10" />

  <!-- Top Accent Bar -->
  <rect x="2" y="2" width="916" height="3" fill="url(#goldGrad)" rx="1.5" />

  <!-- Window Dots (Hyprland / Unix Style) -->
  <circle cx="28" cy="24" r="5" fill="#FF5F56" />
  <circle cx="44" cy="24" r="5" fill="#FFBD2E" />
  <circle cx="60" cy="24" r="5" fill="#27C93F" />
  <text x="82" y="28" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="11" fill="#6E7681">akiffurkan@hyperland ~</text>

  <!-- Title -->
  <text x="460" y="82" text-anchor="middle" font-family="'Cinzel', 'Segoe UI', system-ui, sans-serif" font-weight="800" font-size="34" fill="url(#goldGrad)" letter-spacing="3" filter="url(#goldGlow)">
    AKİF FURKAN EMİR
  </text>

  <!-- Subtitle -->
  <text x="460" y="118" text-anchor="middle" font-family="'Montserrat', 'Segoe UI', system-ui, sans-serif" font-weight="500" font-size="14" fill="#8B949E" letter-spacing="1.5">
    FULL-STACK SOFTWARE ENGINEER  •  SYSTEMS &amp; AI ARCHITECT  •  LINUX POWER USER
  </text>

  <!-- Status Badges in SVG -->
  <g transform="translate(310, 142)">
    <rect width="135" height="24" rx="12" fill="#1F2937" stroke="#374151" stroke-width="1" />
    <circle cx="14" cy="12" r="3.5" fill="#10B981" />
    <text x="26" y="16" font-family="'Montserrat', sans-serif" font-size="10" font-weight="600" fill="#10B981" letter-spacing="0.5">OPEN TO WORK</text>
  </g>

  <g transform="translate(465, 142)">
    <rect width="145" height="24" rx="12" fill="#1F2937" stroke="#374151" stroke-width="1" />
    <circle cx="14" cy="12" r="3.5" fill="#D4AF37" />
    <text x="26" y="16" font-family="'Montserrat', sans-serif" font-size="10" font-weight="600" fill="#F5E6B8" letter-spacing="0.5">ALWAYS BUILDING</text>
  </g>
</svg>
